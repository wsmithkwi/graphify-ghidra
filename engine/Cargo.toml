[package]
name = "gg-engine"
version = "0.1.0"
edition = "2021"
description = "Multithreaded similarity engine for graphify-ghidra"
publish = false

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
