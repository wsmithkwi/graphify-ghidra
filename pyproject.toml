[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-ghidra"
version = "0.1.0"
description = "Ghidra support for graphify: export a Program (or REA output) as a queryable reverse-engineering knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["graphify", "ghidra", "reverse-engineering", "rea", "knowledge-graph", "mcp", "binary-analysis"]
dependencies = [
    "graphifyy>=0.9.111",
    "numpy>=1.21",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graphify-ghidra = "graphify_ghidra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphify_ghidra = [
    "ghidra_scripts/*.java", "skill/*.md", "bin/*",
    "pi_package/package.json", "pi_package/extensions/*.ts", "pi_package/skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
